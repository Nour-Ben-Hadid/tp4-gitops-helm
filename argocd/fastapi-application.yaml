apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tp4-fastapi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nour-Ben-Hadid/tp4-gitops-helm.git
    targetRevision: main
    path: charts/fastapi
    helm:
      releaseName: tp4-fastapi
  destination:
    server: https://kubernetes.default.svc
    namespace: tp4-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
