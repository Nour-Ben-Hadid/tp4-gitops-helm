apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tp4-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nour-Ben-Hadid/tp4-gitops-helm.git
    targetRevision: main
    path: charts/monitoring
    helm:
      releaseName: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
